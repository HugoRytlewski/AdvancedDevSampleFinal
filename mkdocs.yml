site_name: AdvancedDevSample API
site_description: Documentation technique de l'API AdvancedDevSample
site_author: Hugo Rytlewski
site_url: https://hugorytlewski.github.io/AdvancedDevSampleFinal/

repo_name: HugoRytlewski/AdvancedDevSampleFinal
repo_url: https://github.com/HugoRytlewski/AdvancedDevSampleFinal

theme:
  name: material
  language: fr
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mode clair
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Accueil: index.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Qualite du Code: sonarcloud.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HugoRytlewski/AdvancedDevSampleFinal
  generator: false

extra_css:
  - stylesheets/extra.css
